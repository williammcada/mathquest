name: Verify MathQuest candidate
# Runs the checks that need a normal package install (happy-dom DOM tests, wrangler packaging).
# Read-only: builds and tests; never deploys.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Release validation
        run: node scripts/validate-release.mjs
      - name: Full test suite (including DOM runtime tests)
        run: npm test
      - name: Worker packaging dry run (no deployment)
        run: |
          npx wrangler deploy --dry-run --outdir build/worker
          ls -la build/worker
          gzip -9 -c build/worker/*.js | wc -c | xargs -I{} echo "Worker bundle gzipped bytes: {}"
