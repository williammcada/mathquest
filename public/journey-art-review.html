<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journey hero animation review</title><style>body{margin:16px;background:#142a2c;color:#eef2e5;font:16px system-ui}button{padding:10px;margin:3px}canvas{width:960px;max-width:100%;image-rendering:pixelated}p{max-width:900px}</style><script type="module" src="./engine/teacher-guard.js?v=0.14.0"></script></head><body><h1>Journey hero animation review</h1><p>Development artwork preview · no classroom progress or mathematics. Full level, boss and finished special choreography remain pending.</p><nav></nav><canvas></canvas><p id="status"></p><script type="module">
import {JourneyRenderer} from './games/journey/renderer.js';import {HERO_ART,HERO_CLIPS} from './games/journey/hero-art.js';
const renderer=new JourneyRenderer(document.querySelector('canvas'));let action='idle',facing=1;const snapshot=()=>({phase:action==='victory'?'terminal':'running',result:{outcome:'victory'},players:Object.keys(HERO_ART).map((hero,i)=>({id:hero,hero,alias:hero,started:true,visible:true,x:100+i*180,y:340,hp:100,maxHp:100,facing,action,combo:0,protectionMs:0,jumpMs:action==='jump'?350:0})),enemies:[],props:[],pickups:[]});
window.review={renderer,set(actionName){action=actionName;renderer.frames.clear();renderer.set(snapshot());},flip(){facing*=-1;renderer.set(snapshot());}};
for(const name of [...Object.keys(HERO_CLIPS),'horse-transform','horse','horse-idle','horse-turn','horse-impact','horse-return']){const b=document.createElement('button');b.textContent=name;b.onclick=()=>window.review.set(name);document.querySelector('nav').append(b);}const flip=document.createElement('button');flip.textContent='Face other direction';flip.onclick=()=>window.review.flip();document.querySelector('nav').append(flip);
window.review.set('idle');function draw(){renderer.draw();document.querySelector('#status').textContent='Clip: '+action+' · '+Object.values(renderer.images).filter(i=>i.complete&&i.naturalWidth).length+' images loaded';requestAnimationFrame(draw);}draw();
</script></body></html>
